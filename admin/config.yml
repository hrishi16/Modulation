# ─────────────────────────────────────────────────────────────
#  Modulation — editor configuration (Decap CMS)
#  At setup, change ONLY these three things (search for them):
#    YOUR-GITHUB-USERNAME   (appears in repo, site_url, display_url)
#    YOUR-SITE-ID           (from DecapBridge, in identity_url)
#  Everything else describes the forms the editor sees at /admin.
# ─────────────────────────────────────────────────────────────
backend:
  name: git-gateway
  repo: YOUR-GITHUB-USERNAME/modulation
  branch: main
  identity_url: https://auth.decapbridge.com/sites/YOUR-SITE-ID
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    update: Edit {{collection}} → {{slug}}
    uploadMedia: Upload {{path}}
    deleteMedia: Delete {{path}}
site_url: https://YOUR-GITHUB-USERNAME.github.io/modulation/
display_url: https://YOUR-GITHUB-USERNAME.github.io/modulation/
local_backend: true
media_folder: images
public_folder: images
editor:
  preview: false
collections:
- name: site
  label: Site
  description: Everything on the site lives here. Open a section, change it, press Publish. The live site updates in about a minute.
  extension: json
  format: json
  editor:
    preview: false
  files:
  - name: settings
    label: ⚙︎ Settings, theme & menu
    file: content/settings.json
    fields:
    - name: site_title
      label: Site name
      widget: string
    - name: site_subtitle
      label: Subtitle next to the name
      widget: string
    - name: browser_title
      label: Title shown in the browser tab
      widget: string
    - name: theme
      label: Theme
      widget: object
      fields:
      - name: background
        label: Background
        widget: select
        options:
        - label: Dark
          value: dark
        - label: Light
          value: light
      - name: accent
        label: Accent colour (the science magenta)
        widget: color
      - name: display_font
        label: Heading typeface
        widget: select
        options:
        - Fraunces
        - Cormorant Garamond
        - Libre Baskerville
        - Playfair Display
        - Spectral
        - Newsreader
        - DM Serif Display
    - name: banner
      label: Banner across the top
      widget: object
      fields:
      - name: show
        label: Show the banner
        widget: boolean
      - name: text
        label: Banner text
        widget: string
        required: false
    - name: nav
      label: Menu — names and which sections are shown
      hint: Invited-artist rooms and extra pages have their own 'show in menu' switch.
      widget: object
      collapsed: true
      fields:
      - name: home
        label: Home — menu name
        widget: string
      - name: exhibition
        label: Exhibition — menu name
        widget: string
      - name: show_exhibition
        label: Show the exhibition
        widget: boolean
      - name: takepart
        label: Take part — menu name
        widget: string
      - name: show_takepart
        label: Show Take part
        widget: boolean
      - name: makemark
        label: Make a mark — menu name
        widget: string
        required: false
      - name: show_makemark
        label: Show Make a mark
        widget: boolean
        required: false
        default: true
      - name: workshops
        label: Workshops — menu name
        widget: string
      - name: show_workshops
        label: Show Workshops
        widget: boolean
      - name: lineage
        label: Lineage — menu name
        widget: string
      - name: show_lineage
        label: Show Lineage
        widget: boolean
      - name: people
        label: Contributors — menu name
        widget: string
      - name: show_people
        label: Show Contributors
        widget: boolean
    - name: footer
      label: Footer
      widget: object
      collapsed: true
      fields:
      - name: supported_by
        label: Grant line
        widget: string
      - name: logo
        label: Logo
        widget: image
        required: false
      - name: note
        label: Credit line
        widget: string
        required: false
      - name: links
        label: Links
        widget: list
        summary: '{{fields.label}}'
        fields:
        - name: label
          label: Link text
          widget: string
        - name: url
          label: Address (https://…)
          widget: string
  - name: home
    label: Home page
    file: content/home.json
    fields:
    - name: eyebrow
      label: Small line above the title
      widget: string
    - name: title
      label: Big title
      widget: string
    - widget: markdown
      buttons:
      - bold
      - italic
      - link
      editor_components: []
      modes:
      - rich_text
      - raw
      name: intro
      label: Opening paragraph
    - name: dial_hint
      label: Instruction under the felt / measured dial
      widget: string
    - name: pairs
      label: Felt ↔ measured pairs (the dial)
      hint: Each pair is an artwork and a science image. Drag to reorder; the first pair shows first.
      widget: list
      summary: '{{fields.felt_alt}} ↔ {{fields.measured_alt}}'
      fields:
      - name: felt
        label: Felt — the artwork
        widget: image
      - name: felt_alt
        label: Felt — short description (for screen readers)
        widget: string
      - name: felt_caption
        label: Felt — caption
        widget: text
      - name: measured
        label: Measured — the science image
        widget: image
        hint: Only a genuine, unedited science image. Art made on top of a micrograph is 'felt', not 'measured'.
      - name: measured_alt
        label: Measured — short description
        widget: string
      - name: measured_caption
        label: Measured — caption
        widget: text
      - name: credit
        label: Credit line
        widget: string
    - name: quote
      label: Quotation
      widget: text
    - name: quote_source
      label: Quotation — source
      widget: string
    - name: film
      label: Film
      widget: object
      fields:
      - name: show
        label: Show the film
        widget: boolean
      - name: label
        label: Small label
        widget: string
      - name: heading
        label: Heading
        widget: string
      - name: youtube_id
        label: YouTube video ID
        widget: string
        hint: The part after youtu.be/ — e.g. -f1EKmDwfkA
      - widget: markdown
        buttons:
        - bold
        - italic
        - link
        editor_components: []
        modes:
        - rich_text
        - raw
        name: note
        label: Note under the film
  - name: exhibition
    label: The exhibition (panels)
    file: content/exhibition.json
    fields:
    - name: label
      label: Small label
      widget: string
    - name: heading
      label: Heading
      widget: string
    - name: intro
      label: Introduction
      widget: text
    - name: panels
      label: Panels
      hint: Add, remove or drag panels to reorder.
      widget: list
      collapsed: true
      summary: '{{fields.number}} · {{fields.title}}'
      fields:
      - name: number
        label: Number
        widget: string
      - name: title
        label: Title
        widget: string
      - name: science_tag
        label: Science keywords (small magenta line)
        widget: string
      - name: text
        label: Panel text
        widget: text
      - name: images
        label: Images
        widget: list
        summary: '{{fields.caption}}'
        fields:
        - name: image
          label: Image
          widget: image
        - name: caption
          label: Caption
          widget: string
        - name: type
          label: What kind of image is this?
          widget: select
          default: art
          options:
          - label: Artwork
            value: art
          - label: Science image (unedited micrograph, scan…)
            value: science
          - label: Art made on a science image
            value: composite
      - name: pair_images
        label: Show artworks beside science images when enlarged
        widget: boolean
        default: false
        hint: 1st artwork pairs with 1st science image, 2nd with 2nd…
      - name: strip_label
        label: Extra science strip — label
        widget: string
        required: false
      - name: strip
        label: Extra science strip — images
        widget: list
        required: false
        summary: '{{fields.caption}}'
        fields:
        - name: image
          label: Image
          widget: image
        - name: caption
          label: Caption
          widget: string
        - name: type
          label: What kind of image is this?
          widget: select
          default: art
          options:
          - label: Artwork
            value: art
          - label: Science image (unedited micrograph, scan…)
            value: science
          - label: Art made on a science image
            value: composite
      - name: links
        label: Read-more links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
        - name: label
          label: Link text
          widget: string
        - name: url
          label: Address
          widget: string
    - name: inroom
      label: In the room
      widget: object
      collapsed: true
      fields:
      - name: show
        label: Show this part
        widget: boolean
      - name: label
        label: Label
        widget: string
      - name: text
        label: Text
        widget: text
      - name: images
        label: Images
        widget: list
        summary: '{{fields.caption}}'
        fields:
        - name: image
          label: Image
          widget: image
        - name: caption
          label: Caption
          widget: string
  - name: takepart
    label: Take part (body map)
    file: content/takepart.json
    fields:
    - name: label
      label: Small label
      widget: string
    - name: heading
      label: Heading
      widget: string
    - name: intro
      label: Introduction
      widget: markdown
      buttons: [bold, italic, link]
      editor_components: []
      modes: [rich_text, raw]
    - name: disclaimer
      label: Disclaimer (keep this)
      widget: text
    - name: step1_label
      label: 'Step 1 label (e.g. "Where is it")'
      widget: string
    - name: step1_hint
      label: Instruction under the body outline
      widget: string
    - name: step2_label
      label: 'Step 2 label (e.g. "Which of these is nearest")'
      widget: string
    - name: step2_sublabel
      label: Step 2 — small text after a dash
      widget: string
    - name: step2_caption
      label: Caption under the details
      widget: text
    - name: step3_label
      label: 'Step 3 label (e.g. "And what is it like")'
      widget: string
    - name: step3_sublabel
      label: Step 3 — small text after a dash
      widget: string
    - name: pool_size
      label: How many details to show at once
      widget: number
      value_type: int
      min: 4
      max: 12
      hint: The details are drawn fresh from the pool below each time; this is how many appear at once.
    - name: word_groups
      label: Word groups (visitor picks up to 3 total, from any row)
      widget: list
      summary: '{{fields.label}}'
      fields:
      - name: label
        label: Row label
        widget: string
      - name: words
        label: Words
        widget: list
        field: {name: word, label: Word, widget: string}
    - name: details
      label: Detail pool — real painting crops
      hint: Each entry is a close, abstract crop of a real painting plus the full painting it reveals. Keep the crop abstract enough that the source isn't obvious. Add as many as you like — the interactive shows a random handful each time.
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: detail
        label: Detail crop (the mystery image shown first)
        widget: image
      - name: full
        label: Full painting (revealed after choosing)
        widget: image
      - name: title
        label: Painting title
        widget: string
      - name: panel_index
        label: Which exhibition panel this belongs to
        widget: select
        options:
        - {label: '01 · Somatosensory system', value: 0}
        - {label: '02 · Pain in the brain', value: 1}
        - {label: '03 · Opioids / poppy', value: 2}
        - {label: '04 · Overcoming', value: 3}
        - {label: '05 · Anxiety and depression', value: 4}
        - {label: '06 · Tactile sensation', value: 5}
    - name: reveal_intro
      label: 'Reveal — lead-in (e.g. "You chose:")'
      widget: string
    - name: reveal_science_label
      label: 'Reveal — label above the science (e.g. "underneath it")'
      widget: string
    - name: reveal_words_label
      label: 'Reveal — label for the visitor''s words (unused placeholder, safe to leave)'
      widget: string
      required: false
    - name: cta_panel
      label: Button — go to the matching panel
      widget: string
    - name: cta_reset
      label: Button — shuffle and try again
      widget: string
    - name: next_label
      label: Button — go on to Make a mark (leave empty to hide)
      widget: string
      required: false
    - name: status_prefix
      label: 'Status line prefix (e.g. "Still to choose:")'
      widget: string
    - name: status_body
      label: Status word for the body-map step
      widget: string
    - name: status_detail
      label: Status word for the detail step
      widget: string
    - name: status_word
      label: Status word for the words step
      widget: string
    - name: closing
      label: Closing line under the interactive
      widget: text
      required: false
  - name: makemark
    label: Make a mark (drawing page)
    file: content/makemark.json
    fields:
    - {name: label, label: Small label, widget: string}
    - {name: heading, label: Heading, widget: string}
    - name: intro
      label: Introduction
      widget: markdown
      buttons: [bold, italic, link]
      editor_components: []
      modes: [rich_text, raw]
    - {name: disclaimer, label: Line under the introduction, widget: string}
    - {name: guide_label, label: Button — follow the workshop prompts, widget: string}
    - {name: free_label, label: Button — draw freely, widget: string}
    - name: steps
      label: Workshop prompts (the guided path)
      hint: These come from the Pain, Felt and Drawn workshop. Each step can suggest a few words and the Modulate tool. Suggestions are only highlighted, never forced.
      widget: list
      summary: '{{fields.title}}'
      fields:
      - {name: title, label: Step title, widget: string}
      - {name: prompt, label: Prompt, widget: text}
      - name: try
        label: Suggested words (must match words in Take part)
        widget: list
        required: false
        field: {name: word, label: Word, widget: string}
      - {name: modulate, label: Suggest the Modulate tool, widget: boolean, required: false, default: false}
    - {name: try_label, label: 'Word before the suggestions (e.g. "Try:")', widget: string}
    - {name: back_label, label: Button — back, widget: string}
    - {name: next_label, label: Button — next, widget: string}
    - {name: guide_source, label: Credit line under the prompts, widget: text}
    - {name: words_label, label: Heading above the word brushes, widget: string}
    - name: palette
      label: Colours
      hint: Add as many as you like. On the dark paper the page switches away from very dark colours automatically.
      widget: list
      summary: '{{fields.name}}'
      fields:
      - {name: name, label: Colour name, widget: string}
      - {name: hex, label: Colour, widget: color}
    - name: grounds
      label: Papers
      widget: list
      summary: '{{fields.name}}'
      fields:
      - {name: name, label: Paper name, widget: string}
      - {name: hex, label: Base colour, widget: color}
      - name: tex
        label: Texture
        widget: select
        options:
        - {label: Smooth paper with fine speckle, value: paper}
        - {label: Tinted sheet with fibres, value: kraft}
        - {label: Dark ground, value: dark}
    - {name: colour_label, label: Heading above the colours, widget: string}
    - {name: size_label, label: Heading above the size slider, widget: string}
    - {name: paper_label, label: Heading above the papers, widget: string}
    - {name: tools_label, label: Heading above Modulate and Lift, widget: string}
    - {name: modulate_label, label: Modulate — button text, widget: string}
    - {name: modulate_hint, label: Modulate — explanation shown when it is selected, widget: text}
    - {name: lift_label, label: Lift — button text, widget: string}
    - {name: lift_hint, label: Lift — explanation, widget: text}
    - {name: title_placeholder, label: Placeholder in the naming box, widget: string}
    - {name: untitled, label: Caption used on the saved image when unnamed, widget: string}
    - {name: undo_label, label: Button — undo, widget: string}
    - {name: clear_label, label: Button — clear, widget: string}
    - {name: save_label, label: Button — save, widget: string}
    - name: reflections
      label: What your hand did
      hint: The page counts which kind of words were used and shows one of these. The word rows in Take part are read in order - first row is feels, second is moves, third is does. Leave the panel and link empty for no button.
      widget: object
      fields:
      - {name: title, label: Heading, widget: string}
      - name: feels
        label: Mostly "how it feels" (first word row)
        widget: object
        fields:
        - {name: text, label: Text, widget: text}
        - name: panel
          label: Exhibition panel to link to
          widget: select
          required: false
          options:
          - {label: No link, value: ''}
          - {label: '01 · Somatosensory system', value: 0}
          - {label: '02 · Pain in the brain', value: 1}
          - {label: '03 · Opioids / poppy', value: 2}
          - {label: '04 · Overcoming', value: 3}
          - {label: '05 · Anxiety and depression', value: 4}
          - {label: '06 · Tactile sensation', value: 5}
        - {name: link, label: Link text, widget: string, required: false}
      - name: moves
        label: Mostly "how it moves" (second word row)
        widget: object
        fields:
        - {name: text, label: Text, widget: text}
        - name: panel
          label: Exhibition panel to link to
          widget: select
          required: false
          options:
          - {label: No link, value: ''}
          - {label: '01 · Somatosensory system', value: 0}
          - {label: '02 · Pain in the brain', value: 1}
          - {label: '03 · Opioids / poppy', value: 2}
          - {label: '04 · Overcoming', value: 3}
          - {label: '05 · Anxiety and depression', value: 4}
          - {label: '06 · Tactile sensation', value: 5}
        - {name: link, label: Link text, widget: string, required: false}
      - name: does
        label: Mostly "what it does" (third word row)
        widget: object
        fields:
        - {name: text, label: Text, widget: text}
        - name: panel
          label: Exhibition panel to link to
          widget: select
          required: false
          options:
          - {label: No link, value: ''}
          - {label: '01 · Somatosensory system', value: 0}
          - {label: '02 · Pain in the brain', value: 1}
          - {label: '03 · Opioids / poppy', value: 2}
          - {label: '04 · Overcoming', value: 3}
          - {label: '05 · Anxiety and depression', value: 4}
          - {label: '06 · Tactile sensation', value: 5}
        - {name: link, label: Link text, widget: string, required: false}
      - name: mixed
        label: A mix of all three
        widget: object
        fields:
        - {name: text, label: Text, widget: text}
        - name: panel
          label: Exhibition panel to link to
          widget: select
          required: false
          options:
          - {label: No link, value: ''}
          - {label: '01 · Somatosensory system', value: 0}
          - {label: '02 · Pain in the brain', value: 1}
          - {label: '03 · Opioids / poppy', value: 2}
          - {label: '04 · Overcoming', value: 3}
          - {label: '05 · Anxiety and depression', value: 4}
          - {label: '06 · Tactile sensation', value: 5}
        - {name: link, label: Link text, widget: string, required: false}
      - name: modulated
        label: Added when the visitor used Modulate
        widget: object
        fields:
        - {name: text, label: Text, widget: text}
        - name: panel
          label: Exhibition panel to link to
          widget: select
          required: false
          options:
          - {label: No link, value: ''}
          - {label: '01 · Somatosensory system', value: 0}
          - {label: '02 · Pain in the brain', value: 1}
          - {label: '03 · Opioids / poppy', value: 2}
          - {label: '04 · Overcoming', value: 3}
          - {label: '05 · Anxiety and depression', value: 4}
          - {label: '06 · Tactile sensation', value: 5}
        - {name: link, label: Link text, widget: string, required: false}
      - {name: takepart_link, label: Link text back to Take part, widget: string}
  - name: artists
    label: Invited artists
    file: content/artists.json
    fields:
    - widget: markdown
      buttons:
      - bold
      - italic
      - link
      editor_components: []
      modes:
      - rich_text
      - raw
      name: statement
      label: Statement on the invited artists
    - name: artists
      label: Artists — each one gets their own room and menu tab
      hint: To add an artist press 'Add artists', fill in the name and a one-word web address, and switch 'Show in menu' on.
      widget: list
      collapsed: true
      summary: '{{fields.name}}'
      fields:
      - name: name
        label: Artist's name
        widget: string
      - name: nav_label
        label: Menu name
        widget: string
      - name: slug
        label: Web address (one word, lowercase)
        widget: string
        pattern:
        - ^[a-z0-9-]+$
        - Lowercase letters, numbers and hyphens only
      - name: show_in_nav
        label: Show in menu
        widget: boolean
        default: true
      - name: label
        label: Small label
        widget: string
        default: Invited artist
      - name: title
        label: Room title
        widget: string
      - name: intro
        label: Introduction
        widget: text
      - name: details
        label: Medium · size · dates
        widget: string
        required: false
      - name: coming_soon
        label: Work still to come
        widget: boolean
        default: false
      - name: coming_soon_text
        label: Coming-soon message
        widget: string
        required: false
      - name: sections
        label: Sections of the room
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
        - name: label
          label: Section heading
          widget: string
        - name: layout
          label: Layout
          widget: select
          default: row
          options:
          - label: Row of images
            value: row
          - label: Book with magnifying lens
            value: magnifier
        - name: items
          label: Images
          widget: list
          summary: '{{fields.caption}}'
          fields:
          - name: image
            label: Image
            widget: image
          - name: caption
            label: Caption
            widget: text
          - name: alt
            label: Short description (for screen readers)
            widget: string
            required: false
  - name: workshops
    label: Workshops
    file: content/workshops.json
    fields:
    - name: label
      label: Small label
      widget: string
    - name: heading
      label: Heading
      widget: string
    - name: intro
      label: Introduction
      widget: text
    - name: workshops
      label: Workshops
      hint: Newest first reads best. Drag to reorder.
      widget: list
      collapsed: true
      summary: '{{fields.title}} — {{fields.when}}'
      fields:
      - name: title
        label: Title
        widget: string
      - name: when
        label: Date and time
        widget: string
      - name: where
        label: Venue, partners, facilitators
        widget: text
      - name: poster
        label: Poster
        widget: image
        required: false
      - name: poster_caption
        label: Poster caption
        widget: string
        required: false
      - widget: markdown
        buttons:
        - bold
        - italic
        - link
        editor_components: []
        modes:
        - rich_text
        - raw
        name: description
        label: Description
      - name: prompts
        label: Prompts
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
        - name: label
          label: Label
          widget: string
        - name: text
          label: Prompt
          widget: text
      - name: gallery_label
        label: Gallery heading
        widget: string
        required: false
      - name: gallery
        label: Participant work and photographs
        hint: Only publish participant work with their consent. Put the maker's name only if they asked to be named.
        widget: list
        required: false
        summary: '{{fields.caption}}'
        fields:
        - name: image
          label: Image
          widget: image
        - name: caption
          label: Caption
          widget: string
        - name: maker
          label: Made by (leave blank if not to be named)
          widget: string
          required: false
      - name: credit
        label: Credit line
        widget: string
        required: false
    - name: consent_note
      label: Consent note at the bottom
      widget: text
  - name: lineage
    label: Lineage
    file: content/lineage.json
    fields:
    - name: label
      label: Small label
      widget: string
    - name: heading
      label: Heading
      widget: string
    - name: intro
      label: Introduction
      widget: text
    - name: cards
      label: Works (linked, not reproduced)
      widget: list
      summary: '{{fields.title}} — {{fields.artist}}'
      fields:
      - name: title
        label: Title
        widget: string
      - name: artist
        label: Artist · date
        widget: string
      - name: text
        label: Short text
        widget: text
      - name: link_label
        label: Link text
        widget: string
      - name: url
        label: Museum page address
        widget: string
    - name: essay_label
      label: Essay heading
      widget: string
